<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SceneSpeak</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #6b7280;
    --line: #d9dce1;
    --accent: #2457c5;
    --accent-dark: #1a42a0;
    --good: #1d7a46;
    --good-bg: #eaf6ef;
    --tip: #8a5a00;
    --tip-bg: #fdf4e3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
  header h1 { margin: 0; font-size: 28px; }
  header p { margin: 4px 0 0; color: var(--muted); }
  section { margin-top: 32px; }
  h2 { font-size: 20px; margin: 0 0 12px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  textarea {
    width: 100%;
    font: inherit;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--card);
    color: var(--text);
    resize: vertical;
  }
  #source { min-height: 18em; overflow-y: auto; }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  button {
    font: inherit;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { background: var(--accent-dark); }
  button:disabled { cursor: not-allowed; opacity: 0.5; }
  .soon { font-size: 12px; color: var(--muted); margin-left: -6px; }
  .note { font-size: 13px; color: var(--muted); margin-top: 8px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h3 { margin: 0 0 8px; font-size: 20px; color: var(--accent); }
  .card h4 {
    margin: 14px 0 4px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .card p { margin: 0; }
  .quote { border-left: 3px solid var(--line); padding-left: 10px; color: #3b4452; }
  .scene { background: var(--bg); border-radius: 6px; padding: 10px 12px; }
  .scene .tag { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .scene .line { margin: 2px 0; }
  .practice textarea { min-height: 3.5em; }
  .practice .scene { margin-bottom: 8px; }
  .row.listen { margin-top: 8px; align-items: center; }
  .hint { font-size: 13px; color: var(--muted); margin-left: 8px; }
  .feedback { margin-top: 10px; border-radius: 6px; padding: 10px 12px; font-size: 14px; }
  .feedback .works { background: var(--good-bg); color: var(--good); padding: 8px 10px; border-radius: 4px; }
  .feedback .tip { background: var(--tip-bg); color: var(--tip); padding: 8px 10px; border-radius: 4px; margin-top: 6px; }
  .feedback .warn { color: var(--muted); }
  #phrasebook ul { list-style: none; margin: 0; padding: 0; }
  #phrasebook li {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  #phrasebook li strong { color: var(--accent); }
  .empty { color: var(--muted); }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>SceneSpeak</h1>
    <p>See the scene. Say it right.</p>
  </header>

  <section id="input-section">
    <label for="source">Paste your reading, syllabus, slides, or transcript</label>
    <textarea id="source" rows="14">Thanks for having me today. When I started as a product manager, I thought the job was about shipping features. It is not. Every quarter we ask which projects will really move the needle for our customers. Once we find a winner, we double down on it instead of spreading ourselves thin. Early on, go after the low-hanging fruit, the easy fixes that users notice right away. Before any launch, I make sure engineering, design, and sales are on the same page. If a decision stalls, we park it and circle back once we have more data. At the end of the day, product management is about solving real problems for real people.</textarea>
    <div class="row">
      <button id="find" class="primary" type="button">Find key phrases</button>
      <button id="upload" type="button" disabled>Upload PDF</button>
      <span class="soon">Coming soon</span>
    </div>
    <p class="note">Demo: this prototype always shows the same built-in example. Editing the text does not change the results.</p>
  </section>

  <section id="results-section" class="hidden">
    <h2>Key phrases</h2>
    <div id="results"></div>
  </section>

  <section id="phrasebook">
    <h2>My phrasebook</h2>
    <p id="empty-msg" class="empty">Nothing saved yet. Use "Save to my phrasebook" on a card.</p>
    <ul id="saved-list"></ul>
  </section>
</main>

<script>
  // Hard-coded demo data. No AI, no network.
  var PHRASES = [
    {
      phrase: "move the needle",
      meaning: "To make a clear, noticeable difference to a result that matters, like sales or customer satisfaction.",
      sentence: "Every quarter we ask which projects will really move the needle for our customers.",
      sceneType: "Team meeting",
      scene: [
        "Maya: We have ten ideas on the list. Which one matters most?",
        "Leo: The checkout fix. It could really move the needle on sales.",
        "Maya: Agreed. Let's drop the small stuff for now.",
        "Leo: I'll write up the plan today."
      ],
      works: "Your sentence uses the phrase for a result you can notice, which is how people use it.",
      tip: "Name the result (for example, 'move the needle on retention') so the listener knows what is changing."
    },
    {
      phrase: "double down on",
      meaning: "To put even more effort or money into something that is already working.",
      sentence: "Once we find a winner, we double down on it instead of spreading ourselves thin.",
      sceneType: "Class discussion",
      scene: [
        "Professor: Our case company has one product that sells well. What should it do?",
        "Priya: I would double down on it and cut the weaker products.",
        "Professor: Is that risky?",
        "Priya: A little, but focus usually beats spreading out."
      ],
      works: "You used 'double down on' with something that was already succeeding, which fits the meaning.",
      tip: "Follow it with a noun or -ing phrase ('double down on marketing'). Do not say 'double down' alone with 'on' missing."
    },
    {
      phrase: "low-hanging fruit",
      meaning: "The easy tasks or quick wins you can finish first because they take little effort.",
      sentence: "Early on, go after the low-hanging fruit, the easy fixes that users notice right away.",
      sceneType: "Coffee chat",
      scene: [
        "Sam: My to-do list is huge. Where do I start?",
        "Ana: Start with the low-hanging fruit, like the typos and broken links.",
        "Sam: Quick wins first, then the big projects?",
        "Ana: Exactly. It builds momentum."
      ],
      works: "You described a task that is easy and gives a quick result. That is the core idea.",
      tip: "Add what the easy wins are, or what comes next, to make the sentence feel complete."
    },
    {
      phrase: "on the same page",
      meaning: "Everyone understands the plan and agrees on it.",
      sentence: "Before any launch, I make sure engineering, design, and sales are on the same page.",
      sceneType: "Team meeting",
      scene: [
        "Jo: Before we leave, are we all on the same page about the deadline?",
        "Kim: I thought it was Friday.",
        "Jo: It is Thursday. Let me fix that in the notes.",
        "Kim: Good catch. Now we are on the same page."
      ],
      works: "You used it to talk about shared understanding between people, which is correct.",
      tip: "It works well with a group ('the whole team is on the same page'). Try naming who needs to agree."
    },
    {
      phrase: "circle back",
      meaning: "To return to a topic later, usually after you have more information or time.",
      sentence: "If a decision stalls, we park it and circle back once we have more data.",
      sceneType: "Class discussion",
      scene: [
        "Student: I do not have the numbers for that question yet.",
        "Professor: No problem. Let's circle back after the break.",
        "Student: I can check the report by then.",
        "Professor: Great. Next topic, then."
      ],
      works: "You used it to postpone a topic and return later, which matches how people say it.",
      tip: "Add a time ('circle back on Monday') so it sounds like a real plan and not a way to avoid the topic."
    },
    {
      phrase: "at the end of the day",
      meaning: "When you think about everything, the most important point is this.",
      sentence: "At the end of the day, product management is about solving real problems for real people.",
      sceneType: "Coffee chat",
      scene: [
        "Chen: I keep going back and forth on both job offers.",
        "Rosa: List the pros and cons. What matters most?",
        "Chen: At the end of the day, I want to learn from good people.",
        "Rosa: Then you already know your answer."
      ],
      works: "You used it to introduce your main conclusion, which is the usual job of this phrase.",
      tip: "Put a comma after it and keep the point short. It is stronger when it states one clear conclusion."
    }
  ];

  // "Your turn" setup lines and patterns to check the reply uses the phrase (any verb form).
  var EXTRA = {
    "move the needle": { who: "Maya", line: "We only have time for one project this month. Which one should we pick?", match: /mov(e|es|ed|ing) the needle/i },
    "double down on": { who: "Professor", line: "The app's video feature is growing fast, but the other features are flat. What would you do?", match: /doubl(e|es|ed|ing) down/i },
    "low-hanging fruit": { who: "Sam", line: "Our app has lots of small bugs. Where should we start?", match: /low[- ]hanging fruit/i },
    "on the same page": { who: "Jo", line: "Before the client call, should we check that everyone agrees on the price?", match: /on the same page/i },
    "circle back": { who: "Professor", line: "Do you have the survey results for this question yet?", match: /circl(e|es|ed|ing) back/i },
    "at the end of the day": { who: "Rosa", line: "So, the big company or the startup? Which one will you choose?", match: /at the end of the day/i }
  };

  var canSpeak = "speechSynthesis" in window;

  // Read the scene aloud with the browser's built-in voice (free, no AI, no network).
  function speakScene(lines) {
    if (!canSpeak) return;
    window.speechSynthesis.cancel();
    lines.forEach(function (line) {
      var text = line.indexOf(": ") > -1 ? line.slice(line.indexOf(": ") + 2) : line;
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.9;
      window.speechSynthesis.speak(u);
    });
  }

  var saved = []; // in-page only, no storage

  var findBtn = document.getElementById("find");
  var resultsSection = document.getElementById("results-section");
  var resultsEl = document.getElementById("results");
  var savedList = document.getElementById("saved-list");
  var emptyMsg = document.getElementById("empty-msg");

  // Small helper: create an element with optional class and text (textContent only, so user input is never parsed as HTML).
  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function buildCard(item, index) {
    var card = el("article", "card");
    card.appendChild(el("h3", null, item.phrase));

    card.appendChild(el("h4", null, "What it means"));
    card.appendChild(el("p", null, item.meaning));

    card.appendChild(el("h4", null, "From your text"));
    card.appendChild(el("p", "quote", "“" + item.sentence + "”"));

    card.appendChild(el("h4", null, "See the scene"));
    var scene = el("div", "scene");
    scene.appendChild(el("div", "tag", item.sceneType));
    item.scene.forEach(function (line) { scene.appendChild(el("div", "line", line)); });
    card.appendChild(scene);

    var listenRow = el("div", "row listen");
    var listenBtn = el("button", null, "🔊 Listen & repeat");
    listenBtn.type = "button";
    listenRow.appendChild(listenBtn);
    listenRow.appendChild(el("span", "hint", canSpeak ? "Listen, then say each line out loud." : "Read-aloud is not supported in this browser."));
    if (!canSpeak) listenBtn.disabled = true;
    listenBtn.addEventListener("click", function () { speakScene(item.scene); });
    card.appendChild(listenRow);

    var extra = EXTRA[item.phrase];
    card.appendChild(el("h4", null, "Your turn"));
    var practice = el("div", "practice");
    var inputId = "practice-" + index;
    var setup = el("div", "scene");
    setup.appendChild(el("div", "line", extra.who + ": " + extra.line));
    practice.appendChild(setup);
    var label = el("label", null, "Reply to " + extra.who + " using “" + item.phrase + "”");
    label.setAttribute("for", inputId);
    var input = el("textarea");
    input.id = inputId;
    input.rows = 2;
    practice.appendChild(label);
    practice.appendChild(input);

    var row = el("div", "row");
    var checkBtn = el("button", null, "Check");
    checkBtn.type = "button";
    var saveBtn = el("button", null, "Save to my phrasebook");
    saveBtn.type = "button";
    row.appendChild(checkBtn);
    row.appendChild(saveBtn);
    practice.appendChild(row);

    var feedback = el("div", "feedback hidden");
    feedback.setAttribute("aria-live", "polite");
    practice.appendChild(feedback);
    card.appendChild(practice);

    checkBtn.addEventListener("click", function () {
      feedback.className = "feedback";
      feedback.textContent = "";
      if (input.value.trim() === "") {
        feedback.appendChild(el("div", "warn", "Type a sentence first, then press Check."));
        return;
      }
      if (!extra.match.test(input.value)) {
        feedback.appendChild(el("div", "tip", "Try using “" + item.phrase + "” in your reply."));
        return;
      }
      feedback.appendChild(el("div", "works", "What works: " + item.works));
      feedback.appendChild(el("div", "tip", "One suggestion: " + item.tip));
      feedback.appendChild(el("div", "warn", "Example feedback only. A real check is coming later."));
    });

    saveBtn.addEventListener("click", function () {
      if (saved.indexOf(index) === -1) {
        saved.push(index);
        renderPhrasebook();
      }
      saveBtn.textContent = "Saved";
      saveBtn.disabled = true;
    });

    return card;
  }

  function renderPhrasebook() {
    savedList.textContent = "";
    emptyMsg.className = saved.length ? "empty hidden" : "empty";
    saved.forEach(function (index) {
      var item = PHRASES[index];
      var li = el("li");
      li.appendChild(el("strong", null, item.phrase));
      li.appendChild(el("div", null, item.meaning));
      savedList.appendChild(li);
    });
  }

  findBtn.addEventListener("click", function () {
    resultsEl.textContent = "";
    PHRASES.forEach(function (item, i) { resultsEl.appendChild(buildCard(item, i)); });
    // Re-mark already-saved cards so state stays consistent if the user clicks Find again.
    saved.forEach(function (index) {
      var btns = resultsEl.querySelectorAll(".card")[index].querySelectorAll("button");
      btns[1].textContent = "Saved";
      btns[1].disabled = true;
    });
    resultsSection.className = "";
    resultsSection.scrollIntoView({ behavior: "smooth" });
  });
</script>
</body>
</html>
